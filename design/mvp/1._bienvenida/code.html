<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

Lexend"], "label-md": ["Lexend"], "body-bold": ["Lexend"], "headline-md": ["Lexend"], "body-lg": ["Lexend"], "body-xl": ["Lexend"], "headline-lg-mobile": ["Lexend"], "headline-lg": ["Lexend"], "headline-xl-mobile": ["Lexend"], "headline-xl": ["Lexend"] }, fontSize: { "label-lg": ["18px", { lineHeight: "26px", letterSpacing: "0.02em", fontWeight: "600" }], "label-md": ["16px", { lineHeight: "24px", letterSpacing: "0.02em", fontWeight: "500" }], "body-bold": ["18px", { lineHeight: "28px", fontWeight: "600" }], "headline-md": ["22px", { lineHeight: "32px", fontWeight: "600" }], "body-lg": ["18px", { lineHeight: "28px", letterSpacing: "0.01em", fontWeight: "400" }], "body-xl": ["20px", { lineHeight: "32px", letterSpacing: "0.01em", fontWeight: "400" }], "headline-lg-mobile": ["24px", { lineHeight: "34px", fontWeight: "700" }], "headline-lg": ["28px", { lineHeight: "38px", fontWeight: "700" }], "headline-xl-mobile": ["30px", { lineHeight: "40px", fontWeight: "700" }], "headline-xl": ["36px", { lineHeight: "48px", letterSpacing: "-0.01em", fontWeight: "700" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f9f9ff;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);

  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-secondary-fixed pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full pb-8">
<!-- Tarjeta de bienvenida y cabecera institucional -->
<div class="px-5 pt-3 pb-2 flex items-center justify-between">
<!-- Logotipo e Identidad con sutil tricolor ecuatoriano -->
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center shadow-md relative overflow-hidden">
<span class="material-symbols-outlined text-surface-container-lowest text-3xl" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<!-- Acento tricolor sutil y digno -->
<div class="absolute bottom-0 inset-x-0 h-1.5 flex">
<div class="h-full w-1/2 bg-secondary-container"></div>
<div class="h-full w-1/4 bg-primary-fixed-dim"></div>
<div class="h-full w-1/4 bg-error"></div>
</div>
</div>
<div>
<div class="flex items-center gap-1.5">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Alfabet</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant font-medium">Ecuador Lee y Crece</p>
</div>
</div>
<!-- Acceso Rápido: Modo Guiado por Voz -->
<button aria-label="Activar asistencia de voz guiada" class="px-3.5 py-2.5 rounded-full bg-surface-container-high text-on-surface flex items-center gap-2 active:scale-95 transition-transform shadow-sm focus:outline-none" id="voice-mode-toggle" onclick="toggleVoiceGuide()">
<span class="material-symbols-outlined text-secondary text-2xl" id="voice-mode-icon">record_voice_over</span>
<span class="font-label-md text-label-md font-semibold text-on-surface hidden sm:inline">Voz guiada</span>
</button>
</div>
<div class="px-5 mt-3 flex flex-col gap-5 max-w-xl mx-auto w-full">
<!-- Mensaje Principal con Tipografía de Alto Impacto -->
<div class="bg-surface-container-lowest rounded-3xl p-6 shadow-sm flex flex-col gap-4">
<div class="flex items-start justify-between gap-3">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-primary leading-tight font-bold">
          Aprende a leer y escribir a tu ritmo.
        </h1>
</div>
<!-- Botón de Audio Omnipresente (Altavoz) -->
<button aria-label="Escuchar la bienvenida en voz alta" class="w-full min-h-[64px] bg-surface-container text-on-surface rounded-2xl px-5 py-3.5 flex items-center justify-between gap-4 shadow-sm active:scale-98 transition-all hover:bg-surface-container-high" id="audio-speaker-btn" onclick="reproducirAudioBienvenida()">
<div class="flex items-center gap-3.5">
<div class="w-12 h-12 rounded-xl bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0 shadow-sm" id="speaker-icon-box">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</div>
<div class="text-left">
<p class="font-label-lg text-label-lg text-on-surface font-semibold" id="speaker-text-status">Toca aquí para escuchar</p>
<p class="font-label-md text-label-md text-on-surface-variant">Voz clara y pausada</p>
</div>
</div>
<span class="material-symbols-outlined text-secondary text-2xl" id="audio-wave-anim">graphic_eq</span>
</button>
</div>
<!-- Fotografía / Retrato Inspirador y Digno de Adulto Ecuatoriano Logrando Metas -->
<div class="relative w-full h-64 rounded-3xl overflow-hidden shadow-md bg-surface-container-high">
<img alt="Persona adulta sosteniendo un cuaderno de estudio con orgullo" class="w-full h-full object-cover" data-alt="Dignified close portrait of a warm Ecuadorian adult learner smiling proudly while holding an open notebook in a brightly lit community workshop room in Quito, natural daylight, soft blue and golden ambient tones, hopeful and inspiring humanist photography style, high resolution" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7CQ9s3tNFArU-ote7kYSLFOFWMTkwJF_ChdoMRoQSjabz8tTxVBdtpL6ZKKwHGe2OGyMHk1BJ6hd5DfXg6GwiWWNBdj9-EylHO7lwsGGqaBL6Y4E6-0B-F4WYjmXrilEW7lRasGksKHjlYa7BKlMTqMkwyb5aPmuoa6tUuQVNY8Hf0pDB90kk9zyxrEmH17jyLRxxX_OFsSpIbyL0p7iSOWNWnEoW0Xhw9-B3Gak"/>
<!-- Degradado de protección visual y distintivo de confianza -->
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/70 via-transparent to-transparent flex items-end p-5">
<div class="flex items-center gap-2.5 text-surface-container-lowest">
<span class="material-symbols-outlined text-secondary-fixed text-2xl" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-body-bold text-body-bold tracking-wide">Gratuito, seguro y para todos</span>
</div>
</div>
</div>
<!-- Indicador de Retroalimentación de Audio en Pantalla (Oculto dinámico) -->
<div class="hidden bg-secondary-fixed text-on-secondary-fixed rounded-2xl p-4 flex items-center gap-3 animate-pulse" id="audio-feedback-banner">
<span class="material-symbols-outlined text-secondary text-2xl">hearing</span>
<p class="font-body-bold text-body-bold">«¡Bienvenida y bienvenido! Estamos listos para comenzar juntos.»</p>
</div>
<!-- ZONA DE ACCIÓN PRINCIPAL (Thumb reach ergonomics) -->
<div class="flex flex-col gap-3.5 mt-2">
<!-- BOTÓN GIGANTE: COMENZAR -->
<button aria-label="Comenzar el aprendizaje ahora" class="w-full min-h-[72px] bg-secondary-container text-on-secondary-container rounded-3xl px-6 py-4 flex items-center justify-between shadow-lg active:translate-y-0.5 transition-transform duration-150 focus:outline-none" onclick="iniciarProceso()">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest/30 flex items-center justify-center">
<span class="material-symbols-outlined text-3xl font-bold" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</div>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-wide">COMENZAR</span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-lowest/30 flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">mic</span>
</div>
</button>
<!-- BOTÓN SECUNDARIO: Ya tengo cuenta -->
<button aria-label="Ingresar si ya tengo una cuenta registrada" class="w-full min-h-[60px] bg-surface-container-lowest text-primary rounded-2xl px-6 py-3.5 flex items-center justify-center gap-3 shadow-sm active:scale-98 transition-all hover:bg-surface-container-low focus:outline-none" onclick="abrirIngreso()">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">key</span>
<span class="font-label-lg text-label-lg font-bold">Ya tengo cuenta</span>
</button>
</div>
<!-- Módulo de Asistencia Telefónica o Presencial Sencilla -->
<div class="p-4 rounded-2xl bg-surface-container flex items-center justify-between text-on-surface">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl">support_agent</span>
<span class="font-label-md text-label-md font-medium text-on-surface-variant">¿Deseas ayuda por teléfono?</span>
</div>
<button aria-label="Llamar al soporte gratuito" class="px-4 py-2 rounded-xl bg-primary text-on-primary font-label-md text-label-md font-semibold active:scale-95 shadow-sm" onclick="llamarAyuda()">
        Llamar gratis
      </button>
</div>
</div>
</div>
<script>
  let speaksActive = false;
  let voiceGuideActive = false;

  function reproducirAudioBienvenida() {
    const banner = document.getElementById('audio-feedback-banner');
    const statusText = document.getElementById('speaker-text-status');
    const waveIcon = document.getElementById('audio-wave-anim');
    const box = document.getElementById('speaker-icon-box');

    if (!speaksActive) {
      speaksActive = true;
      banner.classList.remove('hidden');
      statusText.textContent = "Reproduciendo mensaje...";
      waveIcon.classList.add('animate-spin');
      box.classList.add('ring-4', 'ring-secondary-fixed');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const texto = "Bienvenido a Alfabet. Aprende a leer y escribir a tu ritmo. Toca el botón grande amarillo que dice COMENZAR para dar el primer paso.";
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-EC';
        utterance.rate = 0.85; // Habla pausada y clara para máxima inteligibilidad
        
        utterance.onend = () => {
          speaksActive = false;
          statusText.textContent = "Toca aquí para escuchar de nuevo";
          waveIcon.classList.remove('animate-spin');
          box.classList.remove('ring-4', 'ring-secondary-fixed');
          setTimeout(() => {
            banner.classList.add('hidden');
          }, 2000);
        };

        window.speechSynthesis.speak(utterance);
      } else {
        setTimeout(() => {
          speaksActive = false;
          statusText.textContent = "Toca aquí para escuchar";
          waveIcon.classList.remove('animate-spin');
          box.classList.remove('ring-4', 'ring-secondary-fixed');
          banner.classList.add('hidden');
        }, 4000);
      }
    } else {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      speaksActive = false;
      statusText.textContent = "Toca aquí para escuchar";
      waveIcon.classList.remove('animate-spin');
      box.classList.remove('ring-4', 'ring-secondary-fixed');
      banner.classList.add('hidden');
    }
  }

  function toggleVoiceGuide() {
    voiceGuideActive = !voiceGuideActive;
    const btn = document.getElementById('voice-mode-toggle');
    const icon = document.getElementById('voice-mode-icon');
    
    if (voiceGuideActive) {
      btn.classList.add('bg-primary', 'text-on-primary');
      btn.classList.remove('bg-surface-container-high', 'text-on-surface');
      icon.classList.remove('text-secondary');
      icon.classList.add('text-on-primary');
      
      if ('speechSynthesis' in window) {
        const guiadomsg = new SpeechSynthesisUtterance("Modo guiado activado. Toca cualquier elemento de la pantalla para escucharlo.");
        guiadomsg.lang = 'es-EC';
        guiadomsg.rate = 0.9;
        window.speechSynthesis.speak(guiadomsg);
      }
    } else {
      btn.classList.remove('bg-primary', 'text-on-primary');
      btn.classList.add('bg-surface-container-high', 'text-on-surface');
      icon.classList.add('text-secondary');
      icon.classList.remove('text-on-primary');
    }
  }

  function iniciarProceso() {
    if ('speechSynthesis' in window) {
      const resp = new SpeechSynthesisUtterance("Iniciando tu recorrido. ¡Mucho éxito!");
      resp.lang = 'es-EC';
      window.speechSynthesis.speak(resp);
    }
  }

  function abrirIngreso() {
    if ('speechSynthesis' in window) {
      const resp = new SpeechSynthesisUtterance("Abriendo pantalla para ingresar a tu cuenta.");
      resp.lang = 'es-EC';
      window.speechSynthesis.speak(resp);
    }
  }

  function llamarAyuda() {
    if ('speechSynthesis' in window) {
      const resp = new SpeechSynthesisUtterance("Llamando a un asesor comunitario de lectura.");
      resp.lang = 'es-EC';
      window.speechSynthesis.speak(resp);
    }
  }
</script></main></body></html>
