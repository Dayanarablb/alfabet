</div>
</section>
<!-- Audio Instruction Card -->
<section class="w-full mt-4 mb-5">
<div aria-label="Instrucción de audio de la lección" class="w-full bg-secondary-container text-on-secondary-container rounded-2xl p-4 shadow-md transition-all active:scale-[0.99] flex items-center gap-4 cursor-pointer" id="instruction-card" onclick="playInstructionAudio()" role="region">
<button aria-label="Reproducir instrucción por voz" class="w-14 h-14 min-w-[56px] min-h-[56px] rounded-full bg-on-secondary-container text-secondary-fixed flex items-center justify-center shadow-sm active:translate-y-[2px] transition-transform" id="btn-play-instruction" type="button">
<span class="material-symbols-outlined text-[32px]" id="speaker-icon-inst">volume_up</span>
</button>
<div class="flex flex-col min-w-0 flex-1">
<span class="font-label-md text-label-md uppercase tracking-wider font-bold opacity-90">
          Escuchar instrucción
        </span>
<p class="font-body-bold text-body-bold text-on-secondary-container leading-tight" id="instruction-text">
          Mira la letra y escucha cómo suena
        </p>
</div>
</div>
</section>
<!-- Central Card: Letter & Real World Reference -->
<section class="w-full bg-surface-container-lowest rounded-2xl shadow-md p-5 flex flex-col items-center mb-6">
<div class="grid grid-cols-2 gap-4 w-full items-center">
<!-- High Contrast Letter Showcase -->

<!-- Visual Sound Feedback Bubble -->

<section aria-label="Acciones de pronunciación y práctica" class="w-full flex flex-col gap-3 mb-6">

</div>

</button>

<div class="w-12 h-12 rounded-full bg-surface-container-lowest text-primary flex items-center justify-center min-w-[48px] transition-transform" id="mic-icon-wrapper">

        Repetir y decir M
      </span>
<span class="w-3 h-3 rounded-full bg-secondary-container opacity-80" id="mic-status-indicator"></span>
</button>
</section>
<!-- Supportive Adult Pedagogical Message -->
<div class="w-full bg-surface-container-low rounded-xl p-3.5 flex items-center gap-3 mb-6">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-primary flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">thumb_up</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-snug">
      Puedes escuchar cuantas veces quieras antes de hablar.
    </p>
</div>
<!-- Primary Advance Action -->

<span class="font-label-lg text-label-lg font-bold tracking-wide">
        Continuar al siguiente paso
      </span>
<span class="material-symbols-outlined text-[26px]">arrow_forward</span>
</button>
</section>
</div>
<script>
  let isListeningInstruction = false;
  let isPlayingLetterSound = false;
  let isRecording = false;

  function playInstructionAudio() {
    const icon = document.getElementById('speaker-icon-inst');
    const text = document.getElementById('instruction-text');
    if (!icon || !text) return;

    if (isListeningInstruction) return;
    isListeningInstruction = true;

    icon.textContent = 'record_voice_over';
    text.classList.add('underline');

    setTimeout(() => {
      icon.textContent = 'volume_up';
      text.classList.remove('underline');
      isListeningInstruction = false;
    }, 2400);
  }

  function handleSoundPlay() {
    const icon = document.getElementById('sound-btn-icon');
    if (!icon || isPlayingLetterSound) return;

    isPlayingLetterSound = true;
    icon.textContent = 'graphic_eq';

    setTimeout(() => {
      icon.textContent = 'volume_up';
      isPlayingLetterSound = false;
    }, 2000);
  }

  function toggleVoiceRecording() {
    const micWrapper = document.getElementById('mic-icon-wrapper');
    const micLabel = document.getElementById('mic-btn-label');
    const statusDot = document.getElementById('mic-status-indicator');
    if (!micWrapper || !micLabel || !statusDot) return;

    isRecording = !isRecording;

    if (isRecording) {
      micWrapper.classList.add('scale-110');
      micLabel.textContent = '¡Te escuchamos! Di "M"...';
      statusDot.classList.replace('bg-secondary-container', 'bg-tertiary-fixed-dim');
      statusDot.classList.add('animate-ping');

      setTimeout(() => {
        if (isRecording) {
          toggleVoiceRecording();
        }
      }, 3500);
    } else {
      micWrapper.classList.remove('scale-110');
      micLabel.textContent = 'Repetir y decir M';
      statusDot.classList.replace('bg-tertiary-fixed-dim', 'bg-secondary-container');
      statusDot.classList.remove('animate-ping');
    }
  }

  function proceedToNextStep() {
    // Provide tactile feedback before progression
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script></main></body></html>
